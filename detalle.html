<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detalle del inmueble · Conaltura Inmobiliaria</title>
<link rel="shortcut icon" href="assets/logo1.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/detalle.css" />
</head>
<body>

<header class="encabezado">
  <div class="encabezado__contenido">
    <a href="index.html" class="encabezado__marca">
      <img src="assets/logo.png" alt="Conaltura Inmobiliaria" class="encabezado__logo" />
    </a>
    <a href="index.html" class="enlace-volver">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Volver al catálogo
    </a>
  </div>
</header>

<main class="detalle">

  <!-- Estado: cargando detalle -->
  <div id="detalle-cargando" class="estado-info">
    <div class="indicador-carga" aria-hidden="true"></div>
    <p class="estado-info__titulo">Cargando información del inmueble…</p>
  </div>

  <!-- Estado: error -->
  <div id="detalle-error" class="estado-info estado-info--oculto" role="alert">
    <p class="estado-info__titulo" id="detalle-error-titulo">No fue posible cargar este inmueble.</p>
    <p class="estado-info__detalle" id="detalle-error-detalle"></p>
    <div class="detalle-error__acciones">
      <button type="button" id="detalle-boton-reintentar" class="boton-primario">Reintentar</button>
      <a href="index.html" class="boton-secundario">Volver al catálogo</a>
    </div>
  </div>

  <article id="detalle-contenido" class="detalle__contenido detalle__contenido--oculto">

    <section class="galeria" aria-label="Galería de fotografías">
      <div class="galeria__principal">
        <img id="galeria-imagen-principal" class="galeria__imagen-principal" src="assets/imagen-placeholder.png" alt="" loading="eager" />
        <button type="button" id="galeria-anterior" class="galeria__nav galeria__nav--anterior" aria-label="Foto anterior">‹</button>
        <button type="button" id="galeria-siguiente" class="galeria__nav galeria__nav--siguiente" aria-label="Foto siguiente">›</button>
        <span id="galeria-contador" class="galeria__contador"></span>
      </div>
      <div id="galeria-miniaturas" class="galeria__miniaturas"></div>
    </section>

    <section class="detalle__info">

      <div class="detalle__cabecera">
        <span id="detalle-etiqueta-operacion" class="etiqueta-operacion"></span>
        <h1 id="detalle-titulo" class="detalle__titulo"></h1>
        <p id="detalle-ubicacion" class="detalle__ubicacion"></p>
        <p id="detalle-precio" class="detalle__precio"></p>
      </div>

      <dl class="detalle__caracteristicas" id="detalle-caracteristicas">
        <!-- Se llenan dinámicamente: área, habitaciones, baños, parqueaderos, estrato, administración -->
      </dl>

      <div class="detalle__bloque">
        <h2>Descripción</h2>
        <p id="detalle-descripcion" class="detalle__descripcion"></p>
      </div>

    </section>
  </article>
</main>

<footer class="pie-pagina">
  <p>Conaltura Inmobiliaria</p>
</footer>

<script src="js/utils.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/detalle.js"></script>
</body>
</html>
